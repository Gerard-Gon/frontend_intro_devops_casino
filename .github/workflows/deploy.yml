name: CI/CD Pipeline Frontend

on:
  push:
    branches: [ deploy ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: npm ci && npm run build --configuration=production
    - uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: dist/casino-frontend/browser
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: npm ci
    - run: npm test -- --watch=false --browsers=ChromeHeadless

  push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: dist/casino-frontend/browser
    - uses: actions/checkout@v3
    - uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1
    - uses: aws-actions/amazon-ecr-login@v1
    - name: Construir, Etiquetar y Subir
      env:
        ECR_REGISTRY: 994995081324.dkr.ecr.us-east-1.amazonaws.com
        ECR_REPOSITORY: casino/frontend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:v1.0.0
        docker push -a $ECR_REGISTRY/$ECR_REPOSITORY

  deploy:
    needs: push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1
    - run: aws eks update-kubeconfig --region us-east-1 --name vidal-casino-cluster
    - name: Desplegar en EKS
      env:
        ECR_REGISTRY: 994995081324.dkr.ecr.us-east-1.amazonaws.com
        ECR_REPOSITORY: casino/frontend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        kubectl apply -f k8s/frontend.yaml
        kubectl set image deployment/frontend-deployment frontend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
