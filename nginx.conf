# ============================================================
# nginx.conf — sirve la SPA Angular y hace de API GATEWAY.
# Versión Híbrida: Seguridad no-root (8080) + Rutas de Microservicios
# ============================================================
server {
    listen 8080; # MANTENEMOS TU PUERTO SEGURO 8080
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- Microservicios (Nuevas rutas del profesor) ---
    location /api/bonos {
        proxy_pass http://bonos-service:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/apuestas {
        # Nota: El profe puso 8005. Asegúrate de que coincida con tu service.yaml de apuestas
        proxy_pass http://apuestas-service:8005; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Agregamos también Estadísticas (que mencionaste tener)
    location /api/estadisticas {
        proxy_pass http://estadisticas-service:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # --- Backend principal ---
    location /api/ {
        proxy_pass http://casino-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /health {
        proxy_pass http://casino-backend:3000;
    }

    # --- SPA fallback: cualquier ruta del front la resuelve Angular ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}