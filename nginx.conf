# ============================================================
# nginx.conf — sirve la SPA Angular y hace de API GATEWAY.
#
# Enruta por PREFIJO a los 3 backends (resueltos por DNS interno en EKS o por
# nombre de servicio en docker-compose). El orden no importa: nginx elige el
# prefijo MÁS LARGO que coincida, así /api/bonos y /api/apuestas ganan sobre /api.
# ============================================================
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Microservicios (prefijos más específicos primero conceptualmente) ---
  location /api/bonos {
    proxy_pass http://bonos-service:8004;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
  }

  location /api/apuestas {
    proxy_pass http://apuestas-service:8005;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
  }

  # --- Backend principal (todo lo demás bajo /api y /health) ---
  location /api/ {
    proxy_pass http://casino-backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
  }

  location /health {
    proxy_pass http://casino-backend:3000;
  }

  # --- SPA fallback: cualquier ruta del front la resuelve Angular ---
  location / {
    try_files $uri $uri/ /index.html;
  }
}
